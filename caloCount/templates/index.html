{% extends base.html %}

{% block content %}

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h2 class="text-xl font-semibold mb-4 text-gray-700">Add a Food Item</h2>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Food Name</label>
                {{ form.name }}
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-600 mb-1">Calories</label>
                {{ form.calories }}
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-medium py-2 rounded-lg hover:bg-indigo-700 transition">
                Add Item
            </button>
        </form>
    </div>
    
    <div class="md:col-span-2 space-y-6">
        <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex justify-between items-center">
            <div>
                <span class="text-sm text-gray-500 uppercase font-semibold">Total calories Consumed:</span>
                <p class="text-4xl font-extrabold text-indigo-600">{{ total_calories }} <span class="text-lg font-normal text-gray-500">kcal</span></p>
            </div>
            {% if food_items %}
            <form action="{% url 'reset_calories' %}" method="POST" onsubmit="return confirm('Clear all items for today?');">
                {% csrf_token %}
                <button type="submit" class="bg-red-50 text-red-600 border border-red-200 px-4 py-2 rounded-lg hover:bg-red-100 transition text-sm font-medium">
                    Reset Day
                </button>
            </form>
            {% endif %}
        </div>

    </div>

</div>
{% endblock %}
